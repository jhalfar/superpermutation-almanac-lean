# The root Lake project of a Superpermutation Almanac batch submission.
# Jay Pantone's released proof is in lean/ (three of his files are changed, see README.md); lean/Asym35/,
# lean/Asym33/ and lean/Asym29/ hold counts of the earlier batches (lean/Asym29/ the envelope degree), and
# lean/Asym22/ the transversal design (copies of his grid files in lean/Asym22/TD/), the collision equations
# in local positions and the exponent-22 chain.
# AlmanacAdapter links the final theorem to the Almanac's definitions, and AlmanacSolution states the result.
name = "superpermutation_asymptotics"
version = "0.1.0"
defaultTargets = ["AlmanacSolution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# The released proof modules, read from lean/.
[[lean_lib]]
name = "CoefficientTwoPrecision"
srcDir = "lean"
roots = []
globs = [
  "Challenge", "IntegerControlGrid", "Lean435Compatibility", "PositiveParking",
  "Precision", "ConstAsym.+", "Hunter.+", "LowerBounds.+", "PreimageChain.+",
  "Quantitative.+", "Superperm.+", "SuperpermutationUpperBound.+",
  "SuperpermutationUpperBound43586371.+", "Asym35.+", "Asym33.+", "Asym29.+", "Asym22.+", "Asym25.+"
]

[[lean_lib]]
name = "AlmanacAdapter"

# The four reserved Almanac libraries. The judge writes its own AlmanacDefs,
# AlmanacStatement and AlmanacChallenge over the copies here.
[[lean_lib]]
name = "AlmanacDefs"

[[lean_lib]]
name = "AlmanacStatement"

[[lean_lib]]
name = "AlmanacChallenge"

[[lean_lib]]
name = "AlmanacSolution"
