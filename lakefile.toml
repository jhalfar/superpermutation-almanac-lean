# The root Lake project of a Superpermutation Almanac batch submission: every superpermutation on 7 symbols
# has at least 5,900 letters, with 89 finite searches evaluated by native_decide.
name = "almanac_submission"

# The four reserved Almanac libraries, with their files at the repository root: each has only its name
# and no srcDir. The judge overwrites AlmanacDefs.lean, AlmanacStatement.lean and AlmanacChallenge.lean
# with its own.
[[lean_lib]]
name = "AlmanacDefs"

[[lean_lib]]
name = "AlmanacStatement"

[[lean_lib]]
name = "AlmanacChallenge"

[[lean_lib]]
name = "AlmanacSolution"

# Jay Pantone's statements file (Covers), from github.com/jaypantone/superperm-upper-43-80 at c8fb7ff.
[[lean_lib]]
name = "Challenge"

# The modules of the Hunter-Raudvere library that the proof needs (github.com/urdvr/superpermutations-hunter).
[[lean_lib]]
name = "Hunter"

# The modules of Xiaolong Liu's preimage-chain library that the proof needs
# (github.com/Haruhiyuki/superpermutations-preimage-chain-lower-bounds).
[[lean_lib]]
name = "PreimageChain"

# From github.com/jhalfar/superpermutations: the bridge to Hunter.Ssuper (proofs/lean/words) and the
# lower-bound development (proofs/lean/lower, proofs/lean/n7, proofs/lean/n7_5900, proofs/lean/n7_5901).
[[lean_lib]]
name = "Superperm"

[[lean_lib]]
name = "LowerBounds"

# The four search engines LowerBounds.PSearch, LowerBounds.KSearch, LowerBounds.K16Search and
# LowerBounds.J15Search (PSearch imports nothing, the other three import only the engines before them) as a
# library of their own, compiled to native code: Lake loads it when it builds the modules that import it, so
# the native_decide evaluations run compiled code. It is declared after LowerBounds, so this library, not
# LowerBounds, owns the four modules.
[[lean_lib]]
name = "SearchEngine"
roots = ["LowerBounds.PSearch", "LowerBounds.KSearch", "LowerBounds.K16Search", "LowerBounds.J15Search"]
precompileModules = true

# The linking lemma: the Almanac template from the theorem of LowerBounds.F5900K16Native.
[[lean_lib]]
name = "LowerLinks"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"
